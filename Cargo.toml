[package]
name = "universe"
version = "0.2.0"
edition = "2021"
description = "Every scale of the universe, from the quantum foam to the cosmic web"
license = "Unlicense"
repository = "https://github.com/isene/universe"
authors = ["Geir Isene <g@isene.com>"]

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow = { version = "0.1", path = "../glow", package = "fe2o3-glow" }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
